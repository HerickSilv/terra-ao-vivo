version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      producao:
        dependency-type: production
      desenvolvimento:
        dependency-type: development
  - package-ecosystem: uv
    directory: /etl
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
